/* itens da dupla checagem: texto normal e texto com falha */
const ITENS_DUPLA = [
  { n: 'Capacete',                 ok: 'Jugular afivelada e ajustada',            ruim: 'Jugular solta, capacete balançando',  e: 'Capacete sem jugular ajustada sai da cabeça em um impacto.' },

];

const NOMES = ['Ana Paula', 'Carlos', 'Marina', 'Rafael', 'Beatriz', 'João Pedro', 'Luciana', 'Thiago', 'Fernanda', 'Marcos', 'Juliana', 'Eduardo', 'Camila', 'Roberto', 'Patrícia', 'Vinícius', 'Helena', 'Gustavo', 'Sônia', 'Otávio'];

/* estados do jogo */
const ST = { MENU: 'MENU', PLAT: 'PLATAFORMA', CHK: 'CHECKLIST', DESC: 'DESCIDA', FADE: 'FADE', REC: 'RECEBIMENTO', EXT: 'EXTRACAO', FIM: 'FIM' };

/* =====================================================================
   UTILITÁRIOS
   ===================================================================== */
const cv = document.getElementById('c'), c = cv.getContext('2d');
const FONTE = '"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function guarda(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
function seedRand(s){ return () => (s = (s * 16807) % 2147483647) / 2147483647; }

/* tela: lógica de 720 de altura, largura variável (900 a 1800) */
let W = 1280, H = 720, S = 1, DPR = 1, OY = 0, CW = 1, CH = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  CW = Math.max(1, window.innerWidth); CH = Math.max(1, window.innerHeight);
  cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
  S = Math.min(CH / 720, CW / 900);
  W = clamp(CW / S, 900, 1900); if(CW / S > 1900) S = CW / 1900, W = 1900;
  H = CH / S; OY = (H - 720) / 2;
}
window.addEventListener('resize', resize); resize();

/* ---------- cenário 3D (v2): cenas reais da plataforma por trás da interface 2D; sem WebGL o jogo cai no desenho 2D original ---------- */
let V3 = null;
try{ if(window.Trolley3D){ const k = Trolley3D.montar(document.getElementById('v3d'), { avatar: true, jogo3d: true }); window.__v3k = k ? Object.keys(k).join(',') : 'null'; V3 = k && k.jogo3d ? k.jogo3d : null; } }catch(e){ V3 = null; window.__v3erro = String(e && e.stack || e); }
if(!V3){ const h = document.getElementById('v3d'); if(h) h.style.display = 'none'; }

/* ---------- desenho de texto e formas ---------- */
function rr(x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function txt(s, x, y, size, cor, al, peso, fonte){ c.font = (peso || '600') + ' ' + size + 'px ' + (fonte || FONTE); c.fillStyle = cor || '#fff'; c.textAlign = al || 'left'; c.textBaseline = 'alphabetic'; c.fillText(s, x, y); }
function quebra(s, maxW, size, peso){
  c.font = (peso || '500') + ' ' + size + 'px ' + FONTE; const ps = String(s).split(' '), ls = []; let l = '';
  ps.forEach(p => { const t = l ? l + ' ' + p : p; if(c.measureText(t).width > maxW && l){ ls.push(l); l = p; } else l = t; }); if(l) ls.push(l); return ls;
}
function par(s, x, y, maxW, size, cor, al, peso, lh){
  const ls = quebra(s, maxW, size, peso); lh = lh || size * 1.32; ls.forEach((l, i) => txt(l, x, y + i * lh, size, cor, al, peso)); return ls.length * lh;
}

/* ---------- entrada: botões/arrastos desenhados a cada quadro (modo imediato) ---------- */
let hits = [], drags = [], ptr = { x: -1, y: -1, down: false }, drag = null;
function btn(id, x, y, w, h, label, o, fn){
  o = o || {}; const en = o.en !== false, hover = en && ptr.x >= x && ptr.x <= x + w && ptr.y >= y && ptr.y <= y + h;
  const cor = o.cor || '#FF7A00';
  c.save(); if(en){ c.shadowColor = cor; c.shadowBlur = hover ? 22 : (o.pulso ? 16 + 8 * Math.sin(T0 * 6) : 8); }
  rr(x, y, w, h, o.r || 14);
  if(o.solido !== false && en){ const g = c.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, hover ? '#ffa24a' : cor); g.addColorStop(1, shade(cor, -0.28)); c.fillStyle = g; c.fill(); }
  else { c.fillStyle = en ? 'rgba(20,22,32,.72)' : 'rgba(40,42,54,.55)'; c.fill(); c.lineWidth = 2.5; c.strokeStyle = en ? cor : '#555a6a'; c.stroke(); }
  c.restore();
  const tc = o.solido !== false && en ? (o.texto || '#1a0f00') : (en ? '#fff' : '#8a90a2');
  const ls = String(label).split('\n'); const fs = o.fs || (h > 56 ? 21 : 17);
  ls.forEach((l, i) => txt(l, x + w / 2, y + h / 2 + fs * 0.35 + (i - (ls.length - 1) / 2) * fs * 1.15, i ? fs * 0.8 : fs, tc, 'center', i ? '600' : '800'));
  hits.push({ id, x, y, w, h, fn, en });
}
function shade(hex, k){ const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const f = v => clamp(Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k), 0, 255); return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')'; }
function area(id, x, y, w, h, fn){ hits.push({ id, x, y, w, h, fn, en: true, invisivel: true }); }
function bloqueia(x, y, w, h){ hits.push({ id: 'bloco', x, y, w, h, fn: null, en: false }); }
function arrastavel(id, x, y, w, h, dados){ drags.push({ id, x, y, w, h, dados }); }

function ponto(e){ const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / S, y: (e.clientY - r.top) / S - OY }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); Som.init(); const p = ponto(e); ptr.x = p.x; ptr.y = p.y; ptr.down = true;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){ }
  for(let i = drags.length - 1; i >= 0; i--){ const d = drags[i]; if(p.x >= d.x && p.x <= d.x + d.w && p.y >= d.y && p.y <= d.y + d.h){ drag = { d, ox: p.x - d.x, oy: p.y - d.y, x0: p.x, y0: p.y }; return; } }
});
cv.addEventListener('pointermove', e => { const p = ponto(e); ptr.x = p.x; ptr.y = p.y; });
cv.addEventListener('pointerup', e => {
  e.preventDefault(); const p = ponto(e); ptr.x = p.x; ptr.y = p.y; ptr.down = false;
  if(drag){ const d = drag; drag = null; if(Math.hypot(p.x - d.x0, p.y - d.y0) > 6 || !d.d.dados.clique){ if(chk && chk.solta) chk.solta(d.d, p.x, p.y); } else if(d.d.dados.clique){ d.d.dados.clique(); } return; }
  for(let i = hits.length - 1; i >= 0; i--){ const h = hits[i]; if(p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h){ if(h.en && h.fn){ Som.clique(); h.fn(); } return; } }
});
cv.addEventListener('pointercancel', () => { drag = null; ptr.down = false; });
cv.addEventListener('pointerleave', () => { if(!ptr.down){ ptr.x = -1; ptr.y = -1; } });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => { if(e.key === 'Escape' || e.key === 'p' || e.key === 'P') alternaPausa(); if(e.key === 'm' || e.key === 'M') Som.alterna(); });

/* =====================================================================
   SOM — tudo sintetizado com Web Audio API
   ===================================================================== */
const Som = {
  ctx: null, mestre: null, mudo: guarda(CONFIG.chave + ':mudo') === '1', rolando: null,
  init(){
    if(this.ctx){ if(this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try{ const A = window.AudioContext || window.webkitAudioContext; if(!A) return; this.ctx = new A(); this.mestre = this.ctx.createGain(); this.mestre.gain.value = this.mudo ? 0 : 0.5; this.mestre.connect(this.ctx.destination); }catch(e){ this.ctx = null; }
  },
  alterna(){ this.mudo = !this.mudo; guarda(CONFIG.chave + ':mudo', this.mudo ? '1' : '0'); if(this.mestre) this.mestre.gain.value = this.mudo ? 0 : 0.5; },
  tom(f, d, tipo, v, f2, atraso){
    if(!this.ctx) return; const t = this.ctx.currentTime + (atraso || 0), o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = tipo || 'sine'; o.frequency.setValueAtTime(f, t); if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || 0.2, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.mestre); o.start(t); o.stop(t + d + 0.05);
  },
  ruido(d, v, fil, atraso, q){
    if(!this.ctx) return; const t = this.ctx.currentTime + (atraso || 0), n = Math.floor(this.ctx.sampleRate * d), b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), x = b.getChannelData(0);
    for(let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1);
    const s = this.ctx.createBufferSource(); s.buffer = b; const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = fil || 1500; f.Q.value = q || 0.8;
    const g = this.ctx.createGain(); g.gain.setValueAtTime(v || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); s.connect(f); f.connect(g); g.connect(this.mestre); s.start(t);
  },
  clique(){ this.tom(620, 0.06, 'triangle', 0.12, 420); },
  ok(){ this.tom(660, 0.12, 'sine', 0.18); this.tom(880, 0.18, 'sine', 0.18, null, 0.09); },
  erro(){ this.tom(180, 0.3, 'sawtooth', 0.16, 90); },
  bip(f){ this.tom(f || 880, 0.18, 'square', 0.12); },
  radio(){ this.ruido(0.25, 0.14, 2600, 0, 0.5); this.tom(1200, 0.05, 'square', 0.05); },
  mola(){ this.tom(140, 0.7, 'triangle', 0.25, 60); this.ruido(0.5, 0.1, 400); },
  foto(){ this.ruido(0.08, 0.2, 5000); this.tom(1800, 0.05, 'square', 0.06); },

    '3. O cliente só se aproxima dos cabos totalmente equipado. Peso fora do limite: recuse com educação (também vale pontos). Lançar com falha ou sem a resposta do rádio é erro grave.',
    '4. Na descida, toque em 📷 no momento UAU. No Recebimento você confirma a dupla checagem dos 2 pontos da cadeirinha.',
    '5. Fase 2 (3º cliente): rajadas param o cliente a 30 m das molas: extração simples. Fase 3 (6º cliente): rajadas de 90 km/h param o cliente sobre o vão: extração moderada, com o Resgatista 8. Leia o PAE.',
    '6. Botões do topo: 💬 sem legenda (só clicar nos itens, as regras seguem valendo) · ⛶ tela cheia · som · pausa. Atalhos: P/Esc = pausa, M = som.'
  ];
  let yy = y + 78; L.forEach(l => { yy += par(l, x + 34, yy, w - 68, 15.5, '#dbe2f4', 'left', '500', 20) + 8; });
  txt('EQUIPE · operadores laranja, líderes verde, coordenador laranja e verde · cinto só para resgatistas (Resgatista 8 e Líder de Operações)', W / 2, yy + 6, 14, '#ffd9a8', 'center', '800');
  const ord = ['coord', 'lider', 'lider2', 'op1', 'resg']; const gw = (w - 60) / ord.length;
  ord.forEach((k, i) => { const P = PAPEIS[k], cx = x + 30 + gw * (i + .5); pessoa(cx, yy + 205, .78, 1, { pose: 'idle', t: tCena + i, capacete: COR_EQ(), glow: true, harness: true, papel: k });
    txt(k === 'op1' ? 'Operadores 4 a 7' : P.nome, cx, yy + 228, 12, '#fff', 'center', '800'); txt(k === 'resg' ? 'braçadeira vermelha · capacete vermelho' : 'braçadeira ' + (P.faixa === VERMELHO ? 'vermelha' : 'laranja'), cx, yy + 244, 11, '#aab4cc', 'center', '600'); });
  btn('fechacomo', W / 2 - 110, y + h - 58, 220, 44, 'Entendi', { fs: 19 }, () => { comoJogar = false; });
}
function telaPausa(){
  c.fillStyle = 'rgba(4,6,12,.78)'; c.fillRect(-300, -OY, W + 600, H); txt('PAUSADO', W / 2, 250, 54, '#FF7A00', 'center', '900');
  bloqueia(-300, -OY, W + 600, H);
  btn('retomar', W / 2 - 150, 290, 300, 58, '▶ Retomar', { fs: 22, pulso: true }, () => { pausado = false; });
  btn('p-como', W / 2 - 150, 360, 300, 52, 'Como jogar', { fs: 18, cor: '#4a78c2' }, () => { comoJogar = true; });
  btn('p-novo', W / 2 - 150, 424, 300, 52, '↺ Reiniciar turno', { fs: 18, cor: '#5a6178' }, () => { pausado = false; iniciarTurno(); });
  btn('p-menu', W / 2 - 150, 488, 300, 52, 'Menu principal', { fs: 18, cor: '#5a6178' }, () => { pausado = false; estado = ST.MENU; Som.roldanaFim(); });
}

/* =====================================================================
   LOOP PRINCIPAL
   ===================================================================== */
let ultimo = 0;
function quadro(ts){
  requestAnimationFrame(quadro);
  if(cv.offsetParent === null && !document.fullscreenElement && CW === 0) return;
  if(window.innerWidth < 2 || window.innerHeight < 2) return;
  const dt = Math.min(.05, (ts - ultimo) / 1000 || 0); ultimo = ts;
  if(document.hidden && !pausado && estado !== ST.MENU) pausado = true;
  if(!pausado && !comoJogar){ tCena += dt; T0 = tCena; update(dt); }
  hits = []; drags = [];
  c.setTransform(DPR * S, 0, 0, DPR * S, 0, DPR * S * OY); c.imageSmoothingEnabled = true;
  if(V3){ c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height); c.restore(); } else { c.fillStyle = '#05060a'; c.fillRect(-100, -OY - 100, W + 200, H + 200); }
  desenha(dt);
  if(aviso){ aviso.t -= dt; if(aviso.t <= 0) aviso = null; else { const w = Math.min(760, W - 60), cor = aviso.tipo === 'ok' ? '#6fe08c' : aviso.tipo === 'aviso' ? '#ffb347' : '#9fe0ff'; c.globalAlpha = clamp(aviso.t * 2, 0, 1); const ls = quebra(aviso.m, w - 40, 16, '700'); const hh = 20 + ls.length * 21; const ty = estado === ST.CHK ? 718 - hh : estado === ST.PLAT ? 200 : 100; rr(W / 2 - w / 2, ty, w, hh, 12); c.fillStyle = 'rgba(8,10,18,.92)'; c.fill(); c.strokeStyle = cor; c.lineWidth = 2; c.stroke(); ls.forEach((l, i) => txt(l, W / 2, ty + 27 + i * 21, 16, '#fff', 'center', '700')); c.globalAlpha = 1; } }
  if(fade > 0){ c.fillStyle = 'rgba(0,0,0,' + fade + ')'; c.fillRect(-300, -OY - 10, W + 600, H + 20); }
  if(comoJogar) telaComoJogar();
  else if(pausado) telaPausa();
}
function update(dt){
  if(estado === ST.PLAT){ atualizaPlataforma(dt); }
  else if(estado === ST.CHK){ atualizaPlataforma(dt); atualizaChk(dt); }
  else if(estado === ST.DESC || estado === ST.FADE){ atualizaDescida(dt); }
  else if(estado === ST.REC){ atualizaRec(dt); }
  else if(estado === ST.EXT){ atualizaExt(dt); }
}
function desenha(dt){
  switch(estado){
    case ST.MENU: telaMenu(); break;
    case ST.PLAT: cenaPlataforma(dt); telaPlataforma(); break;
    case ST.CHK: cenaPlataforma(dt); telaChk(); break;
    case ST.DESC: case ST.FADE: cenaDescida(); telaDescida(); break;
    case ST.REC: cenaRecebimento(); telaRecebimento(); break;
    case ST.EXT: cenaExt(); telaExt(); break;
    case ST.FIM: telaFim(); break;
  }
}
requestAnimationFrame(quadro);

/* ganchos de teste (não afetam o jogo) */
window.__sim = { EXT: () => EXT, estado: () => estado, hits: () => hits.map(h => ({ id: h.id, x: h.x, y: h.y, w: h.w, h: h.h, en: h.en })), drags: () => drags.map(d => ({ id: d.id, x: d.x, y: d.y, w: d.w, h: d.h })), chk: () => chk, T: () => T, D: () => D, REC: () => REC, S: () => S, OY: () => OY, setT: (f) => { if(REC) REC.t = f; }, lancar: () => lancar(), recebe: () => iniciaRecebimento(), pular: () => { if(D){ D.t = .85; } } };
})();
