# Publica o jogo no GitHub Pages (grátis em repositório público).
# Roda sozinho a cada push no main e também pelo botão "Run workflow" (aba Actions).
# Endereço: https://lucaspietsch.github.io/Canyon-Fly/
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar a pasta do site (só o que o jogo usa)
        run: |
          mkdir -p _site/t3d
          cp index.html manifest.webmanifest _site/
          cp -r icones data jogo _site/
          cp -r t3d/dist _site/t3d/
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
